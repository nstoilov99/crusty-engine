# Automated PR review by two Claude models with different briefs.
# Codex review (GPT) is configured in ChatGPT > Codex settings, not here.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN repository secret (Claude Pro/Max subscription,
# created with `claude setup-token`). See docs/ai-review-setup.md.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# A new push supersedes any review still running on the old commit.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  # Skips (instead of failing) until CLAUDE_CODE_OAUTH_TOKEN exists. Job-level
  # `if` cannot read secrets directly, hence the hop through an output.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          [ "$HAS_TOKEN" = "true" ] || echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set; AI review skipped (see docs/ai-review-setup.md)"

  review:
    name: ${{ matrix.reviewer.name }}
    needs: preflight
    # Drafts and PRs opted out with the `no-ai-review` label are skipped.
    if: >-
      needs.preflight.outputs.enabled == 'true' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'no-ai-review')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        reviewer:
          - name: Fable (correctness)
            model: claude-fable-5-1
            brief: |
              You are the CORRECTNESS reviewer. Look for bugs that would show up at runtime:
              wrong Z-up / coordinate conventions, logic errors, unhandled error paths, data races
              or lock-order problems across the render thread boundary, unsound unsafe code,
              undo/redo or play/edit state that can drift, resource leaks, off-by-one and
              numeric edge cases, and tests that were weakened to pass. Ignore style.
          - name: Opus (design)
            model: claude-opus-5-5
            brief: |
              You are the DESIGN reviewer. Judge API shape, naming, module boundaries, duplication
              that already has a home elsewhere in the workspace, needless complexity, missing or
              misleading docs, and consistency with docs/ARCHITECTURE.md and docs/editor-ui-style.md.
              Do not report things a linter catches. Ignore pure correctness bugs unless glaring.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review with ${{ matrix.reviewer.name }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model ${{ matrix.reviewer.model }}
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Read,Glob,Grep"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ matrix.reviewer.brief }}

            Ground rules:
            - Read CLAUDE.md first; it states the coordinate system, threading model and code rules.
            - Review only the diff of this PR (gh pr diff). Read surrounding code when needed.
            - Post findings as inline comments on the exact lines. Each comment: what is wrong,
              why it matters, and the concrete fix. One finding per comment.
            - Do not post praise, summaries of the diff, or nitpicks. If you find nothing,
              post ONE short PR comment saying so and stop.
            - Prefix every comment with "[${{ matrix.reviewer.name }}]" so the fixer and the
              human can tell reviewers apart.
            - Never modify files, never push, never approve or request changes formally.
