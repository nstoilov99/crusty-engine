[package]
name = "crusty-gui"
version = "0.1.0"
edition = "2024"
description = "Custom GUI library for the Crusty game engine — hybrid immediate/retained, vulkano-backed, dark glassmorphism aesthetic"
license = "MIT OR Apache-2.0"

[lib]
name = "crusty_gui"
path = "src/lib.rs"

[[bin]]
name = "crusty-gui-demo"
path = "src/main.rs"
required-features = ["demo"]

[features]
default = ["vulkano-renderer", "winit-window", "demo"]
vulkano-renderer = ["dep:vulkano"]
winit-window = ["dep:winit", "dep:raw-window-handle"]
serde = ["dep:serde", "dep:serde_json"]
# Enables the bundled demo binary; pulls in env_logger. Also turns on
# `serde` so the demo can persist its dock layout + UI memory to disk.
demo = ["vulkano-renderer", "winit-window", "dep:env_logger", "serde"]

[dependencies]
ahash = "0.8"
bytemuck = { version = "1", features = ["derive"] }
smallvec = "1"
bitflags = "2"
cosmic-text = "0.12"
swash = "0.1"
etagere = "0.2"
arboard = "3"
log = "0.4"

vulkano = { version = "0.35", optional = true }
winit = { version = "0.30", optional = true }
raw-window-handle = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
env_logger = { version = "0.11", optional = true }

[build-dependencies]
naga = { version = "22", features = ["wgsl-in", "spv-out"] }
